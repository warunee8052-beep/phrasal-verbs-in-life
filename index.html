<!DOCTYPE html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Phrasal verbs in life</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Kanit:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --panel:#ffffff; --ink:#1b2352; --muted:#5a6390; --line:#1b2352;
  --sun:#ffd23f; --sun-ink:#3a2c00; --mint:#1fbf8f; --mint-bg:#dcf7ee; --coral:#ee4266; --coral-bg:#fde3e9;
  --violet:#6c4cf1; --violet-bg:#e9e4ff; --chip:#eef1ff; --shadow:#1b2352;
  --font:"Kanit","Noto Sans Thai","Sarabun",system-ui,-apple-system,"Segoe UI",sans-serif;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --panel:#1b2352; --ink:#f3f5ff; --muted:#b4bcec; --line:#0c1230;
    --mint-bg:#0f4b3d; --coral-bg:#5a1c2e; --violet-bg:#2f2870; --chip:#2a3573; --shadow:#0c1230;
  }
}
:root[data-theme="dark"]{
  --panel:#1b2352; --ink:#f3f5ff; --muted:#b4bcec; --line:#0c1230;
  --mint-bg:#0f4b3d; --coral-bg:#5a1c2e; --violet-bg:#2f2870; --chip:#2a3573; --shadow:#0c1230;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0;overflow:hidden;background:#9fdcff;font-family:var(--font);color:var(--ink)}
#c3d{position:fixed;inset:0;width:100%;height:100%;display:block}
.screen{position:fixed;inset:0;display:none;overflow-y:auto;padding:calc(16px + env(safe-area-inset-top,0px)) 14px calc(16px + env(safe-area-inset-bottom,0px))}
.screen.on{display:block}
.center{min-height:100%;display:flex;align-items:center;justify-content:center}
.card{background:var(--panel);border:3px solid var(--line);border-radius:22px;box-shadow:0 6px 0 var(--shadow);padding:20px;width:100%;max-width:640px}
h1,h2,h3,p{margin:0}
.logo{font-size:clamp(30px,8vw,46px);font-weight:700;line-height:1.05;letter-spacing:-.01em}
.logo small{display:block;font-size:.42em;font-weight:500;color:var(--muted);letter-spacing:0;margin-top:8px}
.sub{color:var(--muted);margin-top:10px;line-height:1.55}
.btn{font-family:inherit;font-weight:600;font-size:18px;border:3px solid var(--line);border-bottom-width:6px;border-radius:16px;padding:12px 18px;background:var(--sun);color:var(--sun-ink);cursor:pointer;width:100%;transition:transform .08s}
.btn:active{transform:translateY(3px);border-bottom-width:3px}
.btn.alt{background:var(--violet);color:#fff}
.btn.ghost{background:var(--panel);color:var(--ink)}
.btn.sm{font-size:15px;padding:8px 14px;width:auto}
.btn:focus-visible,.opt:focus-visible,input:focus-visible{outline:4px solid var(--violet);outline-offset:2px}
.stack{display:grid;gap:10px;margin-top:18px}
.row{display:flex;gap:10px}
.row>*{flex:1}
input[type=text]{font-family:inherit;font-size:17px;width:100%;padding:11px 14px;border-radius:14px;border:3px solid var(--line);background:var(--panel);color:var(--ink)}
.lbl{font-size:14px;color:var(--muted);margin:14px 0 6px;display:block}
.pillrow{display:flex;flex-wrap:wrap;gap:8px;margin-top:16px}
.pill{background:var(--chip);border-radius:999px;padding:6px 12px;font-size:14px;font-weight:500}

/* HUD */
#hud{position:fixed;left:0;right:0;top:0;display:none;padding:calc(10px + env(safe-area-inset-top,0px)) 12px 0;pointer-events:none;z-index:5}
#hud.on{display:block}
.hudbar{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:stretch}
.hbox{background:var(--panel);border:3px solid var(--line);border-radius:14px;box-shadow:0 3px 0 var(--shadow);padding:5px 10px;line-height:1.15;min-width:0}
.hbox b{display:block;font-size:19px}
.hbox span{font-size:12px;color:var(--muted)}
.hbox.grow{flex:1}
.hbox.grow b{font-size:15px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.dots{display:flex;gap:4px;margin-top:4px}
.dots i{width:12px;height:12px;border-radius:50%;border:2px solid var(--line);background:var(--chip)}
.dots i.f{background:var(--sun)}
.bar{max-width:760px;margin:8px auto 0;height:10px;border-radius:99px;background:var(--panel);border:3px solid var(--line);overflow:hidden}
.bar i{display:block;height:100%;width:0;background:var(--mint);transition:width .4s}

/* panel */
#panel{position:fixed;left:0;right:0;bottom:0;display:none;padding:0 12px calc(12px + env(safe-area-inset-bottom,0px));z-index:5;pointer-events:none}
#panel.on{display:block}
#panel .card{margin:0 auto;max-width:760px;max-height:62vh;overflow-y:auto;pointer-events:auto;padding:16px}
.badge{display:inline-block;background:var(--violet);color:#fff;border-radius:10px;padding:3px 10px;font-size:14px;font-weight:600}
.turn{margin-left:8px;font-size:15px;color:var(--ink);background:var(--sun);color:var(--sun-ink);border-radius:10px;padding:3px 10px;font-weight:600}
.qhead{margin-bottom:10px}
.qtext{font-size:clamp(19px,4.6vw,25px);font-weight:600;line-height:1.4}
.blank{display:inline-block;min-width:92px;border-bottom:4px solid var(--violet);vertical-align:baseline;margin:0 3px}
.opts{display:grid;gap:8px;margin-top:14px}
.opt{font-family:inherit;text-align:left;display:flex;gap:12px;align-items:center;font-size:clamp(16px,4vw,19px);font-weight:500;padding:11px 14px;border-radius:14px;border:3px solid var(--line);border-bottom-width:5px;background:var(--panel);color:var(--ink);cursor:pointer}
.opt .L{flex:none;width:30px;height:30px;border-radius:9px;background:var(--chip);display:grid;place-items:center;font-weight:700;font-size:15px}
.opt:not(:disabled):active{transform:translateY(2px)}
.opt.ok{background:var(--mint-bg);border-color:var(--mint)}
.opt.ok .L{background:var(--mint);color:#fff}
.opt.bad{background:var(--coral-bg);border-color:var(--coral)}
.opt.bad .L{background:var(--coral);color:#fff}
.opt:disabled{cursor:default}
.fb{margin-top:14px;border-radius:16px;padding:14px;border:3px solid var(--line)}
.fb.ok{background:var(--mint-bg);border-color:var(--mint)}
.fb.bad{background:var(--coral-bg);border-color:var(--coral)}
.fb h3{font-size:20px}
.fb .en{font-weight:600;margin-top:8px;font-size:17px}
.fb .th{color:var(--muted);margin-top:2px}
.fb .why{margin-top:8px;line-height:1.55}
.tag{display:inline-block;border-radius:8px;padding:2px 9px;font-size:13px;font-weight:600;margin-top:8px}
.tag.literal{background:#cfe9ff;color:#0b3a66}
.tag.idiomatic{background:#ffe3b3;color:#5a3500}
.combo{margin-top:8px;font-weight:700;color:var(--sun-ink);background:var(--sun);border-radius:10px;padding:6px 10px}
.lesson h2{font-size:22px;margin:8px 0 4px}
.ex{display:grid;gap:6px;margin-top:12px}
.ex div{background:var(--chip);border-radius:12px;padding:8px 12px;line-height:1.4}
.ex b{color:var(--violet)}
:root[data-theme="dark"] .ex b{color:#c4b8ff}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .ex b{color:#c4b8ff}}
.ex em{display:block;font-style:normal;color:var(--muted);font-size:14px}
.tip{margin-top:12px;font-size:15px;line-height:1.5;color:var(--muted)}

/* toast */
#toast{position:fixed;left:50%;top:calc(96px + env(safe-area-inset-top,0px));transform:translate(-50%,-14px);background:var(--sun);color:var(--sun-ink);border:3px solid var(--line);border-radius:16px;box-shadow:0 5px 0 var(--shadow);padding:10px 18px;font-weight:700;font-size:18px;z-index:9;opacity:0;pointer-events:none;transition:.25s;text-align:center;max-width:92vw}
#toast.on{opacity:1;transform:translate(-50%,0)}

/* summary */
.sum{max-width:760px;margin:0 auto;display:grid;gap:14px}
.rank{font-size:clamp(26px,7vw,36px);font-weight:700;line-height:1.1}
.big{font-size:56px;font-weight:700;line-height:1}
.stars{font-size:34px;letter-spacing:4px}
.meter{margin-top:10px}
.meter .t{display:flex;justify-content:space-between;font-size:15px;font-weight:500}
.meter .b{height:14px;border-radius:99px;border:3px solid var(--line);background:var(--chip);overflow:hidden;margin-top:4px}
.meter .b i{display:block;height:100%;background:var(--violet)}
.meter.lit .b i{background:#2f9bff}
.meter.idi .b i{background:#ff9f1c}
table{width:100%;border-collapse:collapse;font-size:16px}
th,td{padding:8px 6px;text-align:left;border-bottom:2px solid var(--chip)}
th{color:var(--muted);font-weight:500;font-size:14px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.chip{border-radius:12px;padding:6px 10px;font-size:15px;line-height:1.25}
.chip small{display:block;color:inherit;opacity:.8;font-size:12.5px}
.chip.literal{background:#cfe9ff;color:#0b3a66}
.chip.idiomatic{background:#ffe3b3;color:#5a3500}
.miss{border-left:6px solid var(--coral);background:var(--coral-bg);border-radius:10px;padding:8px 12px;margin-top:8px;line-height:1.5;font-size:15px}
.check{list-style:none;padding:0;margin:10px 0 0;display:grid;gap:8px}
.check li{display:flex;gap:10px;line-height:1.5}
.sec{font-size:20px;font-weight:700;margin-bottom:2px}
.mod{position:fixed;inset:0;z-index:20;background:rgba(10,15,45,.6);display:none;padding:calc(14px + env(safe-area-inset-top,0px)) 12px calc(14px + env(safe-area-inset-bottom,0px));overflow-y:auto}
.mod.on{display:block}
.mod .card{margin:0 auto;max-width:720px}
.mod h3{font-size:19px;margin:18px 0 6px}
.mod p,.mod li{line-height:1.6}
.mod ul,.mod ol{padding-left:22px;margin:6px 0}
.qa{background:var(--chip);border-radius:12px;padding:10px 12px;margin-top:8px;line-height:1.5}
.scroller{overflow-x:auto}
@media (prefers-reduced-motion: reduce){*{transition:none!important}}

.seg{display:inline-flex;border:3px solid var(--line);border-radius:14px;overflow:hidden;background:var(--panel)}
.seg button{font-family:inherit;font-size:15px;font-weight:600;border:0;padding:6px 16px;background:transparent;color:var(--ink);cursor:pointer}
.seg button.on{background:var(--violet);color:#fff}
.seg button:focus-visible{outline:4px solid var(--violet);outline-offset:-4px}
.kpis{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.kpi{background:var(--chip);border-radius:14px;padding:10px 12px}
.kpi b{font-size:26px;display:block;line-height:1.15}
.kpi span{font-size:13px;color:var(--muted)}
.pills{display:flex;flex-wrap:wrap;gap:8px}
.pb{font-family:inherit;font-size:15px;font-weight:600;border:3px solid var(--line);border-radius:999px;background:var(--panel);color:var(--ink);padding:5px 14px;cursor:pointer}
.pb.on{background:var(--sun);color:var(--sun-ink)}
.pb:focus-visible{outline:4px solid var(--violet);outline-offset:2px}
.vrow{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-top:8px}
.vacc{text-align:right;font-size:15px;white-space:nowrap}
</style>
</head>
<body>
<canvas id="c3d" aria-hidden="true"></canvas>

<div id="hud">
  <div class="hudbar">
    <div class="hbox grow"><span id="hBaseSub"></span><b id="hBase">-</b></div>
    <div class="hbox"><span id="hQLbl"></span><b id="hQ">0/20</b></div>
    <div class="hbox"><span id="hScoreLbl"></span><b id="hScore">0</b><div class="dots" id="hDots"></div></div>
  </div>
  <div class="bar"><i id="hBar"></i></div>
</div>

<div id="toast" role="status" aria-live="polite"></div>

<section class="screen on" id="sStart"><div class="center"><div class="card" id="startCard" style="text-align:center"></div></div></section>
<section class="screen" id="sSetup"><div class="center"><div class="card" id="setupCard"></div></div></section>
<div id="panel"><div class="card" id="panelCard"></div></div>
<section class="screen" id="sSum"></section>
<section class="screen" id="sStats"></section>
<div class="mod" id="mTeacher"><div class="card" id="teacherCard"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
(function(){
"use strict";
var $=function(s){return document.querySelector(s)};
var esc=function(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})};
function shuffle(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t}return a}

/* ============ LANGUAGE ============ */
var LANG="th";
try{var sv=localStorage.getItem("pvil-lang");if(sv==="en"||sv==="th")LANG=sv}catch(e){}
function L2(th,en){return LANG==="th"?th:en}
function tx(o){return typeof o==="string"?o:o[LANG]}
function seg(){return '<div class="seg" role="group" aria-label="Language / ภาษา"><button data-lang="th" class="'+(LANG==="th"?"on":"")+'">ไทย</button><button data-lang="en" class="'+(LANG==="en"?"on":"")+'">English</button></div>'}

/* ============ GAME DATA ============ */
var STREAK_LEN=5, STREAK_MULT=10;
var BASES=[
 {id:1,emoji:"🌲",name:{th:"ป่าแห่งการเคลื่อนไหว",en:"Forest of Motion"},sub:{th:"Literal meaning",en:"Literal meaning"},
  lesson:{h:{th:"Literal meaning = ความหมายตรงตัว",en:"Literal meaning = the words mean what they say"},
   p:{th:"Phrasal verb คือ Verb + Particle (up, off, on, out...) ถ้าเห็นภาพการกระทำจริงแล้วแปลตามคำได้เลย คือ literal",en:"A phrasal verb is Verb + Particle (up, off, on, out...). If you can picture the action and translate word by word, it is literal."},
   ex:[["She <b>sat down</b> on the bench.",{th:"เธอนั่งลงบนม้านั่ง",en:"lowered herself onto the bench"}],["He <b>picked up</b> his bag.",{th:"เขาหยิบกระเป๋าขึ้นมา",en:"lifted his bag from the floor"}],["Turn <b>off</b> the fan.",{th:"ปิดพัดลม",en:"stop the fan"}]],
   tip:{th:"เคล็ดลับ: ถามตัวเองว่า “ทำท่าทางนี้ได้จริงไหม?” ถ้าได้ แปลว่าส่วนใหญ่เป็น literal",en:"Tip: ask “Can I really do this action?” If yes, it is usually literal."}},
  qs:[
  {kind:"literal",pv:"take off",mean:{th:"ถอด (เสื้อผ้า/รองเท้า)",en:"remove (clothes/shoes)"},q:"Please ___ your shoes before entering the house.",opts:["take off","take after","take on"],a:0,th:"กรุณาถอดรองเท้าก่อนเข้าบ้าน",why:{th:"take off = ถอด เป็นการกระทำจริง จึงเป็น literal ส่วน take after = หน้าตาเหมือน(ญาติ) และ take on = รับ(งาน)",en:"take off = remove. It is a real action, so it is literal. take after = resemble a relative; take on = accept (a job)."}},
  {kind:"literal",pv:"pick up",mean:{th:"หยิบขึ้น",en:"lift up"},q:"Tom ___ the box from the floor and put it on the shelf.",opts:["picked up","gave up","ran into"],a:0,th:"ทอมหยิบกล่องขึ้นจากพื้นแล้ววางบนชั้น",why:{th:"picked up = หยิบขึ้น (literal) ส่วน gave up = ยอมแพ้ และ ran into = บังเอิญเจอ",en:"picked up = lift (literal). gave up = quit; ran into = meet by chance."}},
  {kind:"literal",pv:"turn on",mean:{th:"เปิด (ไฟ/เครื่องใช้ไฟฟ้า)",en:"switch on (a light/device)"},q:"The room was dark, so she ___ the lights.",opts:["turned off","turned on","turned out"],a:1,th:"ห้องมืด เธอจึงเปิดไฟ",why:{th:"turned on = เปิดไฟ ตรงข้ามกับ turned off (ปิด) ส่วน turned out = ผลปรากฏว่า",en:"turned on = switch on; the opposite is turned off. turned out = ended up being."}},
  {kind:"literal",pv:"blow out",mean:{th:"เป่าให้ดับ",en:"put out by blowing"},q:"He ___ the candles on his birthday cake and made a wish.",opts:["blew up","blew out","blew over"],a:1,th:"เขาเป่าเทียนบนเค้กวันเกิดแล้วอธิษฐาน",why:{th:"blew out = เป่าให้ดับ (literal) ส่วน blew up = ระเบิด/เป่าให้พอง และ blew over = (พายุ/ปัญหา) ผ่านไป",en:"blew out = put out by blowing (literal). blew up = explode or inflate; blew over = (a storm/problem) passed."}}]},
 {id:2,emoji:"🏙️",name:{th:"เมืองชีวิตประจำวัน",en:"Everyday City"},sub:{th:"Literal meaning",en:"Literal meaning"},
  lesson:{h:{th:"Phrasal verbs ใน daily life",en:"Phrasal verbs in daily life"},
   p:{th:"หลายคำที่เราใช้ทุกวันเป็น literal เช่น การขึ้น-ลงรถ การแต่งตัว การเอาของออกไป",en:"Many everyday phrasal verbs are literal: getting on and off transport, dressing, taking things out."},
   ex:[["We <b>got on</b> the bus.",{th:"เราขึ้นรถบัส",en:"boarded the bus"}],["Put <b>on</b> your helmet.",{th:"สวมหมวกกันน็อก",en:"wear your helmet"}],["Please <b>take out</b> the trash.",{th:"ช่วยเอาขยะไปทิ้งหน่อย",en:"carry the trash outside"}]],
   tip:{th:"เคล็ดลับ: particle บอกทิศทาง เช่น up = ขึ้น, off = ออก/ลง, out = ออกไป",en:"Tip: the particle shows direction: up = upward, off = away or down from, out = outward."}},
  qs:[
  {kind:"literal",pv:"get off",mean:{th:"ลงจาก (รถ)",en:"get out of (a bus/train)"},q:"We ___ the bus at Siam station and walked to the mall.",opts:["got off","got over","got along"],a:0,th:"เราลงจากรถบัสที่สถานีสยามแล้วเดินไปห้าง",why:{th:"got off = ลงจากรถ (literal) ส่วน got over = หายจาก/ผ่านพ้น และ got along = เข้ากันได้",en:"got off = leave a bus or train (literal). got over = recover from; got along = have a good relationship."}},
  {kind:"literal",pv:"put on",mean:{th:"สวมใส่",en:"wear"},q:"Don't forget to ___ your jacket; it's cold outside.",opts:["put on","put off","put out"],a:0,th:"อย่าลืมใส่แจ็กเก็ตนะ ข้างนอกหนาว",why:{th:"put on = สวมใส่ ส่วน put off = เลื่อนออกไป และ put out = ดับ(ไฟ)",en:"put on = wear. put off = postpone; put out = extinguish."}},
  {kind:"literal",pv:"take out",mean:{th:"เอาออกไป",en:"carry outside"},q:"She ___ the rubbish before the garbage truck arrived.",opts:["took out","took after","took up"],a:0,th:"เธอเอาขยะไปทิ้งก่อนรถขยะมา",why:{th:"took out = เอาออกไป (literal) ส่วน took up = เริ่มทำ(งานอดิเรก)",en:"took out = carry outside (literal). took up = start (a hobby)."}},
  {kind:"literal",pv:"put up",mean:{th:"ยกขึ้น (มือ)",en:"raise (a hand)"},q:"Please ___ your hand if you know the answer.",opts:["put up","put off","put out"],a:0,th:"กรุณายกมือถ้ารู้คำตอบ",why:{th:"put up your hand = ยกมือขึ้น (literal) ส่วน put off = เลื่อน และ put out = ดับ",en:"put up your hand = raise it (literal). put off = postpone; put out = extinguish."}}]},
 {id:3,emoji:"🔮",name:{th:"ลานเวทมนตร์",en:"Magic Plaza"},sub:{th:"Idiomatic meaning",en:"Idiomatic meaning"},
  lesson:{h:{th:"Idiomatic meaning = ความหมายเชิงสำนวน",en:"Idiomatic meaning = a new meaning"},
   p:{th:"บางครั้งแปลทีละคำแล้วไม่ได้ความ ต้องจำเป็นก้อน เช่น give up ไม่ได้แปลว่า “ให้ขึ้น” แต่แปลว่า “ยอมแพ้”",en:"Sometimes word-by-word translation makes no sense. Learn the whole chunk: give up does not mean “give upward”, it means “quit”."},
   ex:[["Never <b>give up</b>!",{th:"อย่ายอมแพ้",en:"never quit"}],["I can't <b>put up with</b> this heat.",{th:"ฉันทนความร้อนนี้ไม่ไหว",en:"tolerate"}],["She <b>takes after</b> her mom.",{th:"เธอหน้าตา/นิสัยเหมือนแม่",en:"resembles her mom"}]],

th:'<div class="row" style="align-items:center"><h2 style="font-size:24px">📋 คู่มือครู: Phrasal verbs in life</h2><button class="btn sm ghost" id="bClose" style="flex:none">ปิด</button></div>'
+'<div style="margin-top:10px">%SEG%</div>'

en:'<div class="row" style="align-items:center"><h2 style="font-size:24px">📋 Teacher guide: Phrasal verbs in life</h2><button class="btn sm ghost" id="bClose" style="flex:none">Close</button></div>'

+'<h3>Objective</h3><p>Help Grade 11 students understand phrasal verbs and use them in everyday life, telling literal meanings apart from idiomatic meanings through context.</p>'
+'<h3>Materials</h3><p>One phone per player (solo mode) or one phone per group (group mode) with this game open, plus paper and pens for the exit ticket.</p>'

function getStats(){
  if(!memStats){
    try{var s=JSON.parse(localStorage.getItem(SKEY));if(s&&s.players&&s.history)memStats=s}catch(e){}
    if(!memStats)memStats={players:{},history:[]};
  }

}
function persist(){try{localStorage.setItem(SKEY,JSON.stringify(memStats));return true}catch(e){return false}}
function pkey(n){return String(n).trim().toLowerCase()}
function blankP(name){return {name:name,games:0,teamGames:0,answered:0,correct:0,lit:[0,0],idi:[0,0],bestSolo:null,bestStreak:0,combos:0,ms:0,msN:0,last:0,verbs:{}}}
function saveStats(){
  var S0=getStats(), res={newBest:false,prevBest:null,saved:false};
  var dur=Math.round((Date.now()-state.t0)/1000);
  var right=state.log.filter(function(x){return x.ok}).length;
  state.players.forEach(function(pl,idx){
    var k=pkey(pl.name), p=S0.players[k]||(S0.players[k]=blankP(pl.name));
    p.name=pl.name; p.games++; p.last=Date.now();
    if(state.mode==="group")p.teamGames++;
    state.log.forEach(function(x){
      if(x.pi!==idx)return;
      p.answered++; if(x.ok)p.correct++;
      var arr=x.q.kind==="literal"?p.lit:p.idi; arr[0]++; if(x.ok)arr[1]++;
      var vk=x.q.pv+"|"+x.q.kind, v=p.verbs[vk]||(p.verbs[vk]={a:0,c:0}); v.a++; if(x.ok)v.c++;
      p.ms+=x.ms; p.msN++;
    });
    if(state.bestStreak>p.bestStreak)p.bestStreak=state.bestStreak;
    p.combos+=state.bonuses;
    if(state.mode==="solo"){
      res.prevBest=p.bestSolo;
      if(p.bestSolo===null||state.score>p.bestSolo){res.newBest=p.bestSolo!==null;p.bestSolo=state.score}
    }
  });

    score:state.score,right:right,total:state.log.length,dur:dur,combos:state.bonuses});

function buildCsv(){

    rows.push([q(p.name),p.games,p.answered,p.correct,pctS(p.correct,p.answered),p.lit[1],p.lit[0],p.idi[1],p.idi[0],p.bestSolo===null?"":p.bestSolo,p.bestStreak,p.msN?(p.ms/p.msN/1000).toFixed(1):""].join(","))});

    cl.position.set((r()-.5)*160,22+r()*10,15-r()*130);S.add(cl);floaters.push({o:cl,y:cl.position.y,s:.3,rot:0,ph:r()*6,drift:true})}
  hero=makeHero();S.add(hero);clock=new THREE.Clock();
  camPos=new THREE.Vector3();camLook=new THREE.Vector3();
  resize();window.addEventListener("resize",resize);
  resetHero();loop();return true}
function resize(){if(!R)return;var w=window.innerWidth,h=window.innerHeight;R.setSize(w,h,false);C.aspect=w/h;C.fov=w/h<.8?72:55;C.updateProjectionMatrix()}
function camTargets(){var portrait=window.innerHeight>window.innerWidth;
  return {pos:new THREE.Vector3(hero.position.x,portrait?8:7,hero.position.z+(portrait?14:12)),look:new THREE.Vector3(hero.position.x,portrait?-.5:.2,hero.position.z-3)}}
function resetHero(){if(!hero)return;hero.position.set(BPOS[0][0],.1,BPOS[0][1]);var a=BPOS[1];hero.rotation.y=Math.atan2(a[0]-BPOS[0][0],a[1]-BPOS[0][1]);
  walk=null;jumpT=-1;shakeT=-1;var t=camTargets();camPos.copy(t.pos);camLook.copy(t.look)}
function resetWorld(){
  if(!R)return;doneStars.forEach(function(s){S.remove(s);floaters=floaters.filter(function(f){return f.o!==s})});doneStars=[];
  particles.forEach(function(p){S.remove(p.m)});particles=[];resetHero()}
function markDone(i){if(!R)return;var s=new THREE.Mesh(new THREE.OctahedronGeometry(.8),mat(0xffd23f));s.scale.y=1.4;s.position.set(BPOS[i][0]+2.4,4.4,BPOS[i][1]);S.add(s);doneStars.push(s);floaters.push({o:s,y:4.4,s:2,rot:2,ph:0})}
function walkTo(i){return new Promise(function(res){
  if(!R){setTimeout(res,700);return}
  var from=hero.position.clone(),to=new THREE.Vector3(BPOS[i][0],.1,BPOS[i][1]),dx=to.x-from.x,dz=to.z-from.z;
  hero.rotation.y=Math.atan2(dx,dz);walk={from:from,to:to,t:0,dur:Math.max(2.6,Math.hypot(dx,dz)/9),done:res}})}
function heroJump(){jumpT=0}
function heroShake(){shakeT=0}
var cols=[0xffd23f,0xee4266,0x1fbf8f,0x6c4cf1,0x2f9bff,0xff9f1c];
function burst(n){if(!R)return;for(var i=0;i<n;i++){var m=new THREE.Mesh(new THREE.BoxGeometry(.18,.18,.03),new THREE.MeshBasicMaterial({color:cols[i%cols.length]}));
  m.position.set(hero.position.x,hero.position.y+2.8,hero.position.z);S.add(m);
  particles.push({m:m,v:new THREE.Vector3((Math.random()-.5)*7,4+Math.random()*5,(Math.random()-.5)*7),life:1.7,r:new THREE.Vector3(Math.random()*8,Math.random()*8,0)})}}
function loop(){
  requestAnimationFrame(loop);
  var dt=Math.min(clock.getDelta(),.05),time=clock.elapsedTime,moving=false;
  if(walk){moving=true;walk.t+=dt/walk.dur;var k=Math.min(walk.t,1),e=k<.5?2*k*k:1-Math.pow(-2*k+2,2)/2;
    hero.position.x=walk.from.x+(walk.to.x-walk.from.x)*e;hero.position.z=walk.from.z+(walk.to.z-walk.from.z)*e;
    if(k>=1){var d=walk.done;walk=null;if(d)d()}}
  var swing=moving?Math.sin(time*11)*.75:0;legL.rotation.x=swing;legR.rotation.x=-swing;
  var y=.1+(moving?Math.abs(Math.sin(time*11))*.14:Math.sin(time*2)*.03);
  if(jumpT>=0){jumpT+=dt/.55;y+=Math.sin(Math.min(jumpT,1)*Math.PI)*1.4;if(jumpT>=1)jumpT=-1}
  hero.position.y=y;
  if(shakeT>=0){shakeT+=dt/.6;hero.rotation.z=Math.sin(shakeT*38)*.22*(1-Math.min(shakeT,1));if(shakeT>=1){shakeT=-1;hero.rotation.z=0}}
  floaters.forEach(function(f){f.o.position.y=f.y+Math.sin(time*f.s+f.ph)*(f.drift?.8:.35);f.o.rotation.y+=dt*f.rot;if(f.drift)f.o.position.x+=dt*f.s});
  for(var i=particles.length-1;i>=0;i--){var p=particles[i];p.life-=dt;p.v.y-=14*dt;p.m.position.addScaledVector(p.v,dt);p.m.rotation.x+=p.r.x*dt;p.m.rotation.y+=p.r.y*dt;
    if(p.life<=0||p.m.position.y<0){S.remove(p.m);particles.splice(i,1)}}
  var t=camTargets(),f=1-Math.pow(.002,dt);camPos.lerp(t.pos,f);camLook.lerp(t.look,f);
  C.position.copy(camPos);C.lookAt(camLook);R.render(S,C)}

try{initThree()}catch(err){R=null;console.error(err)}
})();
